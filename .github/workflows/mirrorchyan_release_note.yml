name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    # released = 人工放行（取消 Pre-release）或直接发正式版；edited = 正式版的后续编辑。
    types: [edited, released]

# version_name 按事件取 tag：workflow_dispatch 用 inputs.tag，事件触发用 Release 的 tag_name。
# 守卫语义（与 mirrorchyan_release.yml 保持一致）：
#   · 事件触发（edited/released）→ 要求 !prerelease：Release 先建为 Pre-release，
#     人工取消 Pre-release 后才同步说明；Pre-release 阶段的编辑会被挡下（留下 skipped 记录）。
#   · workflow_dispatch → 无 release 载荷，条件恒为真 = 人工显式放行，这是预期行为
#     （release.yml 已不再自动 dispatch 本工作流，「恒真」不再等于闸门被绕过）。
jobs:
  mirrorchyan:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'gunfub' && !github.event.release.prerelease }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MangaProof
          version_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

          owner: gunfub
          repo: MangaProof
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan_exec:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'gunfub' && !github.event.release.prerelease }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MangaProof_exec
          version_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

          owner: gunfub
          repo: MangaProof
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
