name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ''
        required: false
  release:
    types: [edited]

# version_name 按事件取 tag：workflow_dispatch 用 inputs.tag，release.edited 用被编辑 Release 的 tag_name。
# Release 先创建为 Pre-release，人工检查后取消 Pre-release 才触发 release.edited；Pre-release 阶段的其他编辑
# 同样会触发 edited，故两个 job 都用 !prerelease 过滤掉。workflow_dispatch 没有 release 载荷，该条件恒为真。
jobs:
  mirrorchyan:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'gunfub' && !github.event.release.prerelease }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MangaProof
          version_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

          owner: gunfub
          repo: MangaProof
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  mirrorchyan_exec:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'gunfub' && !github.event.release.prerelease }}

    steps:
      - id: uploading
        uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: MangaProof_exec
          version_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

          owner: gunfub
          repo: MangaProof
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
