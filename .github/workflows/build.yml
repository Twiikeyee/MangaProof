name: Desktop Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows 的 _psd_fast.pyd 在 Linux 上用 mingw-w64 交叉编译（纯 C，
  # ctypes 可直接加载），避免依赖 Windows runner 上的 MSVC 环境。
  accel-win:
    name: Windows accel (mingw-w64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Cross-compile _psd_fast.pyd
        run: |
          x86_64-w64-mingw32-gcc -O3 -shared -o mangaproof/_psd_fast.pyd mangaproof/_psd_fast.c
          ls -la mangaproof/_psd_fast.pyd
      - name: Upload accel artifact
        uses: actions/upload-artifact@v7
        with:
          name: accel-windows
          path: mangaproof/_psd_fast.pyd
          if-no-files-found: error

  build-linux:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            label: Linux x64
            spec: packaging/main_linux.spec
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            label: Linux arm64
            spec: packaging/main_linux.spec
            artifact: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # 只安装默认依赖分组与 dev 分组；speedup 分组仅供本地性能分析，构建镜像不需要。
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Build accel extension
        shell: bash
        run: uv run python scripts/build_accel.py
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean "${{ matrix.spec }}"
      - name: Install Qt runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/MangaProof/MangaProof"
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::打包产物启动后提前退出，输出如下："
            cat smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          tail -20 smoke.log || true
      - name: Package artifact
        shell: bash
        run: |
          tar -czf "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" -C dist MangaProof
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            label: macOS x64
            spec: packaging/main_macos.spec
            artifact: macos-x64
          - os: macos-15
            arch: arm64
            label: macOS arm64
            spec: packaging/main_macos.spec
            artifact: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # 只安装默认依赖分组与 dev 分组；speedup 分组仅供本地性能分析，构建镜像不需要。
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Build accel extension
        shell: bash
        run: uv run python scripts/build_accel.py
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean "${{ matrix.spec }}"
      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/MangaProof.app/Contents/MacOS/MangaProof"
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::打包产物启动后提前退出，输出如下："
            cat smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          tail -20 smoke.log || true
      - name: Package artifact
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MangaProof.app" \
            "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: accel-win
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # 只安装默认依赖分组与 dev 分组；speedup 分组仅供本地性能分析，构建镜像不需要。
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Download accel extension
        uses: actions/download-artifact@v8
        with:
          name: accel-windows
          path: mangaproof
      - name: Verify accel present
        shell: pwsh
        run: |
          if (-not (Test-Path "mangaproof\_psd_fast.pyd")) {
            Write-Error "未找到 _psd_fast.pyd"
            exit 1
          }
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean packaging/main_win.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "dist\MangaProof\MangaProof.exe" `
            -RedirectStandardOutput "smoke.log" -RedirectStandardError "smoke.err" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "打包产物启动后提前退出（exit=$($p.ExitCode)）"
            Get-Content "smoke.log","smoke.err" -ErrorAction SilentlyContinue
            exit 1
          }
          taskkill /PID $($p.Id) /T /F | Out-Null
          Start-Sleep -Seconds 2
      - name: Package artifact
        # 与 Linux/macOS 对齐：自建内层 zip（保留 MangaProof 顶层目录），外层 zip 由
        # upload-artifact 自动加。这里用 Python 的 zipfile 而不是 Compress-Archive：
        # 后者会静默跳过隐藏文件、且 .NET 写出的是反斜杠条目标识；Python 两样都没有，
        # 还能在同一段里直接核对归档与源目录是否逐文件一致。重试是为了规避刚构建完的
        # exe 被杀软/索引短暂占用（CI 曾实测到）。
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib, sys, time, zipfile

          # Windows runner 上 stdout 默认走本地代码页（cp1252），中文日志会直接抛
          # UnicodeEncodeError，这里显式改 UTF-8 并容错。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          src = pathlib.Path("dist/MangaProof")
          dst = pathlib.Path("MangaProof-${{ steps.version.outputs.version }}-windows-x64.zip")

          def pack() -> None:
              with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(src.rglob("*")):
                      if p.is_file():
                          z.write(p, arcname=f"MangaProof/{p.relative_to(src).as_posix()}")

          for attempt in range(1, 11):
              try:
                  pack()
                  break
              except OSError as exc:
                  print(f"打包第 {attempt}/10 次失败：{exc}", flush=True)
                  dst.unlink(missing_ok=True)
                  time.sleep(1)
          else:
              raise SystemExit("打包失败：重试 10 次仍未成功")

          want = {
              f"MangaProof/{p.relative_to(src).as_posix()}"
              for p in src.rglob("*")
              if p.is_file()
          }
          with zipfile.ZipFile(dst) as z:
              entries = set(z.namelist())
          missing = sorted(want - entries)
          print(f"{dst.name}：{dst.stat().st_size / 1048576:.1f} MB，"
                f"归档 {len(entries)} 条 / 源目录 {len(want)} 个文件")
          if missing:
              print("缺失条目（前 20）：\n" + "\n".join(missing[:20]))
              raise SystemExit(f"归档缺少 {len(missing)} 个文件")
          if "MangaProof/MangaProof.exe" not in entries:
              raise SystemExit("归档内缺少 MangaProof/MangaProof.exe")
          print("归档内容与源目录一致 ✓")
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-windows-x64
          path: MangaProof-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
